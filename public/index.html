<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaa AI</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #131314; color: #e3e3e3; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; text-align: center; border-bottom: 1px solid #333; background: #1e1e1f; }
        h1 { margin: 0; font-size: 22px; color: #fff; }
        p { margin: 5px 0 0; font-size: 13px; color: #aaa; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user { background: #2b3137; align-self: flex-start; color: #fff; }
        .assistant { background: #1f2227; align-self: flex-end; border: 1px solid #333; color: #e3e3e3; }
        #input-container { padding: 15px; background: #1e1e1f; border-top: 1px solid #333; display: flex; justify-content: center; }
        .input-box { display: flex; max-width: 800px; width: 100%; background: #2b2d31; border-radius: 24px; padding: 8px 15px; }
        input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; }
        button { background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #ccc; }
    </style>
</head>
<body>
    <header>
        <h1>Diaa AI</h1>
        <p>مساعد محادثة فائق السرعة مدعوم بواسطة ضياء وسام</p>
    </header>
    <div id="chat-container"></div>
    <div id="input-container">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>
    <script>
        let history = [];
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chatContainer = document.getElementById('chat-container');
            
            chatContainer.innerHTML += `<div class="message user"><b>أنت:</b><br>${text}</div>`;
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message assistant">جاري الكتابة...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();

                if (res.ok && data.response) {
                    chatContainer.innerHTML += `<div class="message assistant"><b>Diaa AI:</b><br>${data.response.replace(/\n/g, '<br>')}</div>`;
                    history.push({ role: 'user', content: text });
                    history.push({ role: 'assistant', content: data.response });
                } else {
                    const errorMsg = data.detail || 'خطأ غير معروف من الخادم';
                    chatContainer.innerHTML += `<div class="message assistant" style="color: #ff6b6b;"><b>خطأ:</b> ${errorMsg}</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatContainer.innerHTML += `<div class="message assistant" style="color: #ff6b6b;">خطأ في الاتصال بالشبكة.</div>`;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
